site_name: Agent Diagnostic Manual
site_description: Symptoms, candidate diagnoses, and interventions for configured agents.
site_url: https://tkellogg.github.io/agent-diagnostic-manual/
repo_url: https://github.com/tkellogg/agent-diagnostic-manual
edit_uri: ""
docs_dir: .build/docs
site_dir: dist
use_directory_urls: false
theme:
  name: mkdocs
  custom_dir: website/overrides
  highlightjs: false
  navigation_depth: 2
plugins: []
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
extra_css:
  - assets/adm.css
