site_name: Agent Diagnostic Manual
site_description: Symptoms, candidate diagnoses, and interventions for configured agents.
site_url: https://diag.timkellogg.me/
repo_url: https://github.com/tkellogg/agent-diagnostic-manual
edit_uri: ""
docs_dir: .build/docs
site_dir: dist
use_directory_urls: false
theme:
  name: mkdocs
  custom_dir: website/overrides
  highlightjs: true
  navigation_depth: 2
  nav_style: light
  color_mode: light
  user_color_mode_toggle: true
plugins: []
hooks:
  - website/hooks.py
markdown_extensions:
  - attr_list
  - tables
  - fenced_code
  - toc:
      permalink: true
extra_css:
  - assets/adm.css
