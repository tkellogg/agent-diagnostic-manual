name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
          enable-cache: true
          cache-dependency-glob: |
            tools/*.py
            tests/*.py
            examples/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate XML grammar and corpus references
        run: uv run --script tools/build.py --check
      - run: uv run --script tools/test.py
      - name: Smoke-test executable reader
        run: ./examples/query_manual.py > /dev/null
      - name: Build Markdown, HTML, XML variants and search
        run: uv run --script tools/build.py
      - name: Smoke-test release packaging
        run: uv run --script tools/package_release.py --version 0.1.0 --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: adm-preview
          path: dist/
          include-hidden-files: true
